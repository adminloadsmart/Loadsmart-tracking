name: CI

on:
  push:
    # branches: [main, staging]
  pull_request:

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    services:
      # Lets the Redis-backed tests (leader lock) run instead of skipping.
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  boot:
    name: Migrate and boot (ROLE=all)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracking
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tracking" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: production
      ROLE: all
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tracking
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run migration:run:prod
      - name: Boot every role and wait for readiness
        run: |
          npm start > boot.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do
            if curl -sf localhost:9100/readyz > /dev/null; then
              curl -s localhost:9100/readyz
              exit 0
            fi
            sleep 1
          done
          cat boot.log
          exit 1
      - name: Graceful shutdown
        run: |
          kill -TERM "$(cat app.pid)"
          for i in $(seq 1 15); do kill -0 "$(cat app.pid)" 2>/dev/null || exit 0; sleep 1; done
          cat boot.log
          exit 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t loadsmart-tracking:ci .
